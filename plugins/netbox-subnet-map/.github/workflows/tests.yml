name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall netbox_subnet_map
      - run: python -m pip install build
      - run: python -m build
      - run: python -c "import zipfile; z=zipfile.ZipFile(next(__import__('pathlib').Path('dist').glob('*.whl'))); assert not any('/tests/' in n for n in z.namelist())"
