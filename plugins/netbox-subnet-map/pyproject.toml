[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-subnet-map"
version = "0.3.0"
description = "Interactive per-prefix address maps and native grid-driven IP allocation for NetBox"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Jaber"}]
requires-python = ">=3.12"
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Framework :: Django"]
keywords = ["netbox", "ipam", "subnet", "networking"]

[project.urls]
Homepage = "https://github.com/jaber717/netbox-subnet-map"
Repository = "https://github.com/jaber717/netbox-subnet-map"
Issues = "https://github.com/jaber717/netbox-subnet-map/issues"

[tool.setuptools.packages.find]
include = ["netbox_subnet_map*"]
exclude = ["netbox_subnet_map.tests*"]

[tool.setuptools.package-data]
netbox_subnet_map = ["templates/**/*.html", "static/**/*"]
