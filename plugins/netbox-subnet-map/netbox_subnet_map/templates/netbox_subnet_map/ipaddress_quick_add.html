{% load form_helpers %}
{% load helpers %}
{% load i18n %}

<div class="modal-header">
  <h2 class="modal-title">{% trans "Quick Add" %} {{ model|meta:"verbose_name"|bettertitle }}</h2>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body row">
  <form
      hx-post="{{ request.path }}?host={{ host|urlencode }}&_quickadd=True&target=subnet-map"
      hx-target="#htmx-modal-content"
      enctype="multipart/form-data"
  >
    {% csrf_token %}
    <input type="hidden" name="host" value="{{ host }}">
    <input type="hidden" name="_quickadd" value="True">
    <div class="alert alert-info" role="status">
      Allocating from Prefix <strong>{{ prefix.prefix }}</strong>. Address and VRF are fixed by the selected grid cell.
    </div>
    {% include 'htmx/form.html' %}
    <div class="text-end">
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" aria-label="Cancel">{% trans "Cancel" %}</button>
      <button type="submit" class="btn btn-primary">{% trans "Create" %}</button>
    </div>
  </form>
</div>
