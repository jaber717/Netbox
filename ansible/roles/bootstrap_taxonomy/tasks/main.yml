---
- name: Install approved human-readable bootstrap data
  ansible.builtin.copy:
    src: "{{ bundle_root }}/data/bootstrap/"
    dest: /opt/netbox-company/data/bootstrap/
    owner: root
    group: netbox
    mode: preserve

- name: Install taxonomy convergence program
  ansible.builtin.copy:
    src: "{{ bundle_root }}/company/bootstrap_taxonomy.py"
    dest: /opt/netbox-company/bootstrap_taxonomy.py
    owner: root
    group: netbox
    mode: '0640'

- name: Converge approved foundation without operational inventory
  become_user: netbox
  ansible.builtin.shell: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py shell < /opt/netbox-company/bootstrap_taxonomy.py
  args:
    executable: /bin/bash
  environment:
    NETBOX_BOOTSTRAP_DATA: /opt/netbox-company/data/bootstrap
  register: taxonomy_result
  changed_when: "not ('created=0' in taxonomy_result.stdout and 'updated=0' in taxonomy_result.stdout)"
  when: features.bootstrap_taxonomy | bool

