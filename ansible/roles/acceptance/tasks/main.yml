---
- name: Install operational verification command
  ansible.builtin.copy:
    src: "{{ bundle_root }}/acceptance/verify.py"
    dest: /opt/netbox-company/bin/verify.py
    owner: root
    group: root
    mode: '0750'

- name: Install stable verification commands
  ansible.builtin.file:
    src: /opt/netbox-company/bin/verify.py
    dest: "/usr/local/sbin/{{ item }}"
    state: link
  loop:
    - netbox-verify
    - netbox-acceptance

- name: Run complete platform verification
  ansible.builtin.command: /usr/local/sbin/netbox-verify
  register: verify_result
  changed_when: false

- name: Display verification result
  ansible.builtin.debug:
    var: verify_result.stdout_lines
