---
- name: Inspect configured TLS files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ tls.certificate }}"
    - "{{ tls.private_key }}"
  register: tls_files

- name: Generate self-signed development TLS certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:3072
      - -sha256
      - -nodes
      - -days
      - '825'
      - -subj
      - "/CN={{ server.fqdn }}"
      - -addext
      - "subjectAltName=DNS:{{ server.fqdn }},DNS:{{ server.hostname }},IP:{{ expected_network.ip_address }}"
      - -keyout
      - "{{ tls.private_key }}"
      - -out
      - "{{ tls.certificate }}"
  when:
    - tls.mode == 'self_signed_dev'
    - not tls_files.results[0].stat.exists or not tls_files.results[1].stat.exists

- name: Apply private TLS key permissions
  ansible.builtin.file:
    path: "{{ tls.private_key }}"
    owner: root
    group: nginx
    mode: '0640'

- name: Apply TLS certificate permissions
  ansible.builtin.file:
    path: "{{ tls.certificate }}"
    owner: root
    group: root
    mode: '0644'

- name: Validate TLS certificate
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ tls.certificate }}", -noout, -checkend, '86400']
  changed_when: false

- name: Validate TLS private key
  ansible.builtin.command:
    argv: [openssl, pkey, -in, "{{ tls.private_key }}", -check, -noout]
  changed_when: false

- name: Verify TLS certificate and key match
  ansible.builtin.shell: |
    set -euo pipefail
    cert_hash="$(openssl x509 -in '{{ tls.certificate }}' -pubkey -noout | openssl sha256)"
    key_hash="$(openssl pkey -in '{{ tls.private_key }}' -pubout | openssl sha256)"
    test "${cert_hash}" = "${key_hash}"
  args:
    executable: /bin/bash
  changed_when: false

- name: Install nginx virtual host
  ansible.builtin.template:
    src: netbox.conf.j2
    dest: /etc/nginx/conf.d/netbox.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Remove default nginx server when present
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Restart nginx

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

